name: Release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check meta.json matches the tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$tag is not a vX.Y.Z release tag, skipping the meta.json check"
            exit 0
          fi

          meta=$(jq -r .version src/network/TF.EX.Core/meta.json)

          if [[ "$meta" != "${tag#v}" ]]; then
            echo "::error::src/network/TF.EX.Core/meta.json says $meta but the tag is $tag. Bump the meta, then re try"
            exit 1
          fi

      - name: Download ggrs-ffi lib (windows)
        uses: robinraju/release-downloader@v1.11
        with:
          repository: "Fcornaire/ggrs-ffi"
          latest: true
          out-file-path: "src/network/TF.EX.Core/Unmanaged/win-x64"
          fileName: "ggrs_ffi.dll"

      - name: Download ggrs-ffi lib (linux)
        uses: robinraju/release-downloader@v1.11
        with:
          repository: "Fcornaire/ggrs-ffi"
          latest: true
          out-file-path: "src/network/TF.EX.Core/Unmanaged/linux-x64"
          fileName: "libggrs_ffi.so"

      - name: Build the mods
        run: |
          set -euo pipefail
          for proj in \
            src/state/TF.State.Core/TF.State.Core.csproj \
            src/replay/TF.Replay.Core/TF.Replay.Core.csproj \
            src/utilities/TF.InputDisplayer/TF.InputDisplayer.Core/TF.InputDisplayer.Core.csproj \
            src/network/TF.EX.Core/TF.EX.Core.csproj
          do
            echo "::group::build $proj"
            dotnet build "$proj" \
              --configuration Release \
              -p:ModLoaderPath="$GITHUB_WORKSPACE/libs" \
              -p:ModEnablePublish=false \
              -p:ModEnableZip=false
            echo "::endgroup::"
          done

      - name: Stage mod folders
        run: |
          set -euo pipefail
          stage() {
            local out="$1" name="$2"
            mkdir -p "staging/$name"
            cp -r "$out/." "staging/$name/"
            # FortRise never reads deps.json, and its own packer strips it.
            rm -f "staging/$name"/*.deps.json
            test -f "staging/$name/meta.json" || { echo "::error::$name is missing meta.json"; exit 1; }
          }
          stage src/state/TF.State.Core/bin/Release/net10.0      DShad.TF.State
          stage src/replay/TF.Replay.Core/bin/Release/net10.0    DShad.TF.Replay
          stage src/network/TF.EX.Core/bin/Release/net10.0       DShad.TF.EX
          stage src/utilities/TF.InputDisplayer/TF.InputDisplayer.Core/bin/Release/net10.0 DShad.TF.InputDisplayer

          check_clean() {
            local folder="$1" foreign="$2"
            if ls "staging/$folder" | grep -qE "^($foreign)"; then
              echo "::error::$folder contains foreign assemblies"
              ls "staging/$folder"
              exit 1
            fi
          }
          check_clean DShad.TF.EX             'TF\.State\.|TF\.Replay\.|TF\.InputDisplayer\.'
          check_clean DShad.TF.Replay         'TF\.State\.|TF\.EX\.|TF\.InputDisplayer\.'
          check_clean DShad.TF.State          'TF\.Replay\.|TF\.EX\.|TF\.InputDisplayer\.'
          check_clean DShad.TF.InputDisplayer 'TF\.State\.|TF\.Replay\.|TF\.EX\.'

          echo "--- staged tree ---"
          (cd staging && find . -maxdepth 2 | sort)

      - name: Archive the three bundles
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          cd staging
          # State alone.
          zip -r "$GITHUB_WORKSPACE/DShad.TF.State-$tag.zip"  DShad.TF.State
          # The displayer stands alone
          zip -r "$GITHUB_WORKSPACE/DShad.TF.InputDisplayer-$tag.zip" DShad.TF.InputDisplayer
          # Replay draws its inputs through the displayer
          zip -r "$GITHUB_WORKSPACE/DShad.TF.Replay-$tag.zip" DShad.TF.Replay DShad.TF.State DShad.TF.InputDisplayer
          # EX needs all of them
          zip -r "$GITHUB_WORKSPACE/DShad.TF.EX-$tag.zip"     DShad.TF.EX DShad.TF.Replay DShad.TF.State DShad.TF.InputDisplayer

      - name: Upload Release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "DShad.TF.EX-${{ github.ref_name }}.zip,DShad.TF.Replay-${{ github.ref_name }}.zip,DShad.TF.State-${{ github.ref_name }}.zip,DShad.TF.InputDisplayer-${{ github.ref_name }}.zip"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
