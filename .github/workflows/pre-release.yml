name: Pre Release - TF.EX

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download ggrs-ffi lib
        uses: robinraju/release-downloader@v1.11
        with:
          repository: "Fcornaire/ggrs-ffi"
          latest: true
          out-file-path: "src/network/TF.EX.Core/Unmanaged/win-x64"
          fileName: "ggrs_ffi.dll"

      - name: Build the mods
        run: |
          set -euo pipefail
          for proj in \
            src/state/TF.State.Core/TF.State.Core.csproj \
            src/replay/TF.Replay.Core/TF.Replay.Core.csproj \
            src/utilities/TF.InputDisplayer/TF.InputDisplayer.Core/TF.InputDisplayer.Core.csproj \
            src/network/TF.EX.Core/TF.EX.Core.csproj
          do
            echo "::group::build $proj"
            dotnet build "$proj" \
              --configuration Release \
              -p:ModLoaderPath="$GITHUB_WORKSPACE/libs" \
              -p:ModEnablePublish=false \
              -p:ModEnableZip=false
            echo "::endgroup::"
          done

      - name: Stage mod folders
        run: |
          set -euo pipefail
          stage() {
            local out="$1" name="$2"
            mkdir -p "staging/$name"
            cp -r "$out/." "staging/$name/"
            rm -f "staging/$name"/*.deps.json
            test -f "staging/$name/meta.json" || { echo "::error::$name is missing meta.json"; exit 1; }
          }
          stage src/state/TF.State.Core/bin/Release/net10.0      DShad.TF.State
          stage src/replay/TF.Replay.Core/bin/Release/net10.0    DShad.TF.Replay
          stage src/network/TF.EX.Core/bin/Release/net10.0       DShad.TF.EX
          stage src/utilities/TF.InputDisplayer/TF.InputDisplayer.Core/bin/Release/net10.0 DShad.TF.InputDisplayer

          check_clean() {
            local folder="$1" foreign="$2"
            if ls "staging/$folder" | grep -qE "^($foreign)"; then
              echo "::error::$folder contains foreign assemblies"
              ls "staging/$folder"
              exit 1
            fi
          }
          check_clean DShad.TF.EX             'TF\.State\.|TF\.Replay\.|TF\.InputDisplayer\.'
          check_clean DShad.TF.Replay         'TF\.State\.|TF\.EX\.|TF\.InputDisplayer\.'
          check_clean DShad.TF.State          'TF\.Replay\.|TF\.EX\.|TF\.InputDisplayer\.'
          check_clean DShad.TF.InputDisplayer 'TF\.State\.|TF\.Replay\.|TF\.EX\.'

          echo "--- staged tree ---"
          (cd staging && find . -maxdepth 2 | sort)

      - name: Archive
        run: |
          set -euo pipefail
          cd staging
          zip -r "$GITHUB_WORKSPACE/DShad.TF.EX-pre-release.zip" DShad.TF.EX DShad.TF.Replay DShad.TF.State DShad.TF.InputDisplayer

      - name: Upload Pre Release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "DShad.TF.EX-pre-release.zip"
          tag: pre-release
          name: "TF.EX pre-release"
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
